["🛋️", "🍳", "🛏️", "🛁", "🧺", "🗑️", "🧹", "🍽️", "🛒", "🪴", "🧽", "✨", "🪣", "🧼", "🧴", "🧻", "🚿", "🚽", "🪥", "🪞", "🪟", "🚪", "🧯", "🧤", "🧦", "👕", "👖", "👚", "🧸", "🪑", "🛌", "🧊", "🥣", "🍴", "☕", "🥛", "🥦", "🍎", "🥫", "🛍️", "📦", "♻️", "🌱", "🌷", "🐾", "🐕", "🐈", "💡", "🔧", "🧰"];const today=new Date().toISOString().slice(0,10);let month=today.slice(0,7);let inviteCode=new URLSearchParams(location.search).get('join')||'';

async function render(){if(!token){el.innerHTML=`<section class="auth"><div class="authArt">${homePic("House")}<h2>Shared spaces, happier homes.</h2><p>Plan together. Settle fairly. Feel at home.</p></div><div><h1>${reg?'Create your account':'Welcome home'}</h1><p>One place for a fairer household.</p>${form('auth',(reg?field('name','Full name'):'')+field('email','Email','email')+field('password','Password','password'),reg?'Register':'Sign in')}${btn('mode',reg?'Already registered? Sign in':'Create an account')}</div></section>`;bind('auth',async d=>{me=await api(reg?'/register':'/login','POST',d);token=me.token;await render()});return}if(!hub){let hubs=await api('/hubs');el.innerHTML=`${btn('logout','↪ Sign out')}<div class="heroWelcome"><div><small>YOUR HAPPY SPACE</small><h1>Welcome, ${esc(me.name)}</h1><p>Your space, your people, your rhythm.</p></div>${homePic("House")}</div><section>${profileEdit?form('profile',field('name','Your display name','text',me.name),'Save profile')+btn('profilecancel','Cancel'):`<div class="profileline"><div><small>Your profile</small><h2>${esc(me.name)}</h2></div>${btn('profileedit','✎ Edit')}</div>`}</section><div class="grid">${hubs.map(h=>`<article>${homePic(h.plan?.property_type)}<h2>${esc(h.name)}</h2><small>${h.plan?esc(h.plan.property_type)+" · "+h.plan.bedrooms+" bedrooms":"Set up your home layout"}</small>${btn('open:'+h.id,'Open hub')}</article>`).join('')}</div><section>${form('create',field('name','New hub name')+planFields(),'Create hub')}</section><section>${form('join',field('code','Invitation code or link','text',inviteCode),'Join hub')}</section>`;bind('profile',async d=>{me={...me,...await api('/profile','PATCH',d)};profileEdit=false;await render()});bind('create',async d=>{await api('/hubs','POST',d);await render()});bind('join',async d=>{let c=d.code.trim();if(c.includes('?join='))c=new URL(c).searchParams.get('join');else c=c.split('/').pop();await api('/join/'+encodeURIComponent(c),'POST');inviteCode='';await render()});return}board=await api('/hubs/'+hub);ins=board.master?await api('/hubs/'+hub+'/insights'):null;let tabs=['Overview','Chores','Calendar','Groceries','Bills','Messages',...(board.master?['Studio','Members']:[])];el.innerHTML=`${btn('logout','↪ Sign out')}${btn('back','← All homes')}<h1>${board.master?'Master Board':'Guest Board'}</h1><nav>${tabs.map(t=>`<button class="${tab===t?'active':''}" data-action="tab:${t}">${t}</button>`).join('')}</nav><div id="content"></div>`;let c=document.getElementById('content');const rows=(items,k)=>`<div class="grid">${items.map(x=>`<article><span class="art">${esc(x.icon||(k==='bills'?'💳':'🛒'))}</span><h2>${esc(x.name)}</h2><p>${esc(x.due||'')} ${k==='bills'?'€'+(x.cents/100).toFixed(2):''}</p><p>${x.done?'✓ Completed':'Pending'}</p>${k!=='bills'||board.master?btn('toggle:'+k+':'+x.id+':'+Number(!x.done),x.done?'Reopen':'Mark complete'):''}</article>`).join('')}</div>`;

if(tab==='Bills'){let bills=await api('/hubs/'+hub+'/finance'),shares=bills.flatMap(b=>b.shares),paid=shares.filter(x=>x.paid).reduce((a,x)=>a+x.cents,0),owed=shares.filter(x=>!x.paid).reduce((a,x)=>a+x.cents,0),eur=n=>'€'+(n/100).toFixed(2);c.innerHTML=`<div class="grid"><article class="finance"><h2>Collected</h2><div class="metric">${eur(paid)}</div></article><article class="owed"><h2>Outstanding</h2><div class="metric">${eur(owed)}</div></article></div><section><h2>Member balances · all recorded split bills</h2>${board.members.map(m=>{let a=shares.filter(x=>x.user_id===m.id);return `<div class="balanceRow"><b>${esc(m.name)}</b><span class="pill">Paid ${eur(a.filter(x=>x.paid).reduce((s,x)=>s+x.cents,0))}</span><span class="pill owing">Owes ${eur(a.filter(x=>!x.paid).reduce((s,x)=>s+x.cents,0))}</span></div>`}).join('')}</section>`+(board.master?`<section>${form('bill',field('name','Bill name')+field('amount','Amount in euro'),'Add month-end bill')}</section>`:'')+bills.map(b=>`<section><h2>💳 ${esc(b.name)} · ${eur(b.cents)}</h2><p>Due ${esc(b.due)}</p>${b.shares.length?b.shares.map(x=>`<p>${esc(x.name)} · ${eur(x.cents)} · ${x.paid?'Paid ✓':'Owes'} ${board.master?btn('pay:'+b.id+':'+x.user_id+':'+Number(!x.paid),x.paid?'Undo':'Confirm paid'):''}</p>`).join(''):`<p>Not allocated yet</p>${board.master?btn('split:'+b.id,'Split equally among current residents'):''}`}</section>`).join('');bind('bill',async d=>{await api('/hubs/'+hub+'/bills','POST',{name:d.name,cents:Math.round(Number(d.amount)*100)});await render()})}
if(tab==='Bills'){let l=await api('/hubs/'+hub+'/ledger/summary');let euro=v=>'€'+(v/100).toFixed(2);c.insertAdjacentHTML('afterbegin',`<section class="ledger"><h2>Shared expense ledger</h2><small>Separate from legacy household bills. Positive balances are owed to the member.</small>${l.balances.map(b=>`<div class="balanceRow"><b>${esc(b.name)}</b><span class="pill ${b.cents<0?'owing':''}">${b.cents<0?'Owes':b.cents>0?'Gets back':'Settled'} ${euro(Math.abs(b.cents))}</span></div>`).join('')}${board.master?form('expense',field('name','Expense description')+select('payer','Paid by',board.members)+field('amount','Total euro','number')+`<p>Enter each share in euro (leave all zero for equal split).</p>${board.members.map(m=>field('share_'+m.id,esc(m.name),'number','0')).join('')}`,'Record expense')+form('settlement',select('sender','Paid by',board.members)+select('recipient','Paid to',board.members)+field('amount','Settlement euro','number'),'Record settlement'):''}<h2>Expense history</h2>${l.expenses.map(e=>`<p>${esc(e.name)} · ${euro(e.cents)} · paid by ${esc(board.members.find(m=>m.id===e.payer)?.name)}</p>`).join('')||'<p>No expenses yet.</p>'}</section>`);const legacySections=[...c.children].filter(e=>!e.classList.contains('ledger'));const ledgerSection=c.querySelector('.ledger');const panels={Balances:document.createElement('section'),History:document.createElement('section'),Bills:document.createElement('div'),Expense:document.createElement('section'),Settle:document.createElement('section')};panels.Balances.innerHTML='<h2>Member balances</h2>';panels.History.innerHTML='<h2>Expense history</h2>';for(const e of [...ledgerSection.children]){if(e.classList.contains('balanceRow'))panels.Balances.append(e);else if(e.id==='expense')panels.Expense.append(e);else if(e.id==='settlement')panels.Settle.append(e);else if(e.tagName==='P')panels.History.append(e)}legacySections.forEach(e=>{if(e.tagName==='SECTION'&&!e.querySelector('form')&&e.querySelector('h2')?.textContent.startsWith('💳')){const d=document.createElement('details');const h=document.createElement('summary');h.textContent=e.querySelector('h2').textContent;e.querySelector('h2').remove();d.append(h,e);panels.Bills.append(d)}else panels.Bills.append(e)});const mine=l.balances.find(b=>b.id===me.id)?.cents||0;c.innerHTML=`<section class="walletHero"><small>HOUSEHOLD FINANCES · SHARED EXPENSES</small><h1>Smart Wallet</h1><div class="walletMetrics"><div><small>You owe</small><h2>${euro(Math.max(0,-mine))}</h2></div><div><small>You get back</small><h2>${euro(Math.max(0,mine))}</h2></div></div></section><nav class="walletNav"></nav>`;const nav=c.querySelector('.walletNav');for(const key of ['Balances','History','Bills',...(board.master?['Expense','Settle']:[])]){const b=document.createElement('button');b.textContent=key==='Expense'?'＋ Expense':key;b.type='button';nav.append(b);c.append(panels[key]);b.onclick=()=>{for(const k of Object.keys(panels))panels[k].hidden=k!==key;for(const x of nav.children)x.classList.toggle('active',x===b)};}nav.firstElementChild.click();document.querySelectorAll('#expense input[type=number],#settlement input[type=number]').forEach(x=>{x.step='0.01';x.min='0'});bind('expense',async d=>{let cents=Math.round(Number(d.amount)*100),shares=Object.fromEntries(board.members.map(m=>[m.id,Math.round(Number(d['share_'+m.id])*100)]));if(Object.values(shares).every(v=>v===0)){let n=board.members.length;board.members.forEach((m,i)=>shares[m.id]=Math.floor(cents/n)+(i<cents%n?1:0))}await api('/hubs/'+hub+'/ledger/expense','POST',{name:d.name,payer:d.payer,cents,shares});await render()});bind('settlement',async d=>{await api('/hubs/'+hub+'/ledger/settlement','POST',{sender:d.sender,recipient:d.recipient,cents:Math.round(Number(d.amount)*100)});await render()})}
if(tab==='Studio'){let x=board.categories.find(x=>x.id===edit);c.innerHTML=`<section><h2>✨ Chore Studio · ${board.categories.length}/12</h2>${btn('newstudio','＋ New chore')}</section><div class="grid">${board.categories.map(x=>`<article><span class="art">${esc(x.icon)}</span><h2>${esc(x.name)}</h2>${btn('edit:'+x.id,'Edit')}</article>`).join('')}</div>`+(studioOpen||x?`<section>${form('category',field('name','Custom label','text',x?.name)+`<input type="hidden" name="icon" value="${esc(x?.icon||'✨')}"><div class="art" id="chosen">${esc(x?.icon||'✨')}</div><div class="iconGrid">${icons.map(i=>`<button type="button" data-icon="${i}">${i}</button>`).join('')}</div>`,x?'Save category':'Create category')}${btn('cancel','Cancel')}</section>`:'');let f=document.getElementById('category');if(f){let pick=i=>{f.elements.icon.value=i;document.getElementById('chosen').textContent=i;f.querySelectorAll('[data-icon]').forEach(b=>b.classList.toggle('active',b.dataset.icon===i))};f.elements.name.oninput=()=>pick(suggest(f.elements.name.value));f.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>pick(b.dataset.icon));}bind('category',async d=>{await api('/hubs/'+hub+(edit?'/studio/category/'+edit:'/categories'),edit?'PATCH':'POST',d);edit=null;studioOpen=false;await render()})}
if(tab==='Messages'){let homes=await api('/hubs'),owner=homes.find(x=>x.id===hub).owner;let people=board.members.filter(x=>x.id!==me.id&&(board.master||x.id===owner));if(!people.some(x=>x.id===recipient))recipient=people[0]?.id||'';let msgs=await api('/hubs/'+hub+'/messages');c.innerHTML=`<section><h2>Housing Messenger</h2>${form('contact',select('recipient','Conversation',people),'Open conversation')}<div class="chat">${msgs.filter(m=>m.sender===recipient||m.recipient===recipient).map(m=>`<div class="bubble ${m.sender===me.id?'mine':''}"><small>${esc(m.sender_name)} · ${esc(m.sent.slice(0,16))} UTC</small><div>${esc(m.body)}</div></div>`).join('')}</div>${form('message',field('body','Write a message'),'Send message')}${btn('refresh','Refresh messages')}</section>`;document.querySelector('[name=recipient]').value=recipient;bind('contact',async d=>{recipient=d.recipient;await render()});bind('message',async d=>{await api('/hubs/'+hub+'/messages','POST',{recipient,body:d.body});await render()})}

el.addEventListener('click',run(async e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;let [k,v,i,d]=a.split(':');if(k==='profileedit')profileEdit=true;if(k==='profilecancel')profileEdit=false;if(k==='mode')reg=!reg;if(k==='logout'){await api('/logout','POST');token='';hub=null;me=null}if(k==='open'){recipient='';hub=v;tab='Overview'}if(k==='back')hub=null;if(k==='tab'){tab=v;edit=null}if(k==='toggle')await api('/hubs/'+hub+'/'+v+'/'+i,'PATCH',{done:d==='1'});if(k==='edit')edit=v;if(k==='cancel'){edit=null;studioOpen=false}if(k==='newstudio'){edit=null;studioOpen=true}if(k==='day')selectedDay=v;if(k==='monthmove'){let [y,m]=month.split('-').map(Number),dt=new Date(y,m-1+Number(v),1);month=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');selectedDay=''}if(k==='split')await api('/hubs/'+hub+'/finance/'+v+'/split','POST');if(k==='pay')await api('/hubs/'+hub+'/finance/'+v+'/'+i,'PATCH',{done:d==='1'});if(k==='smart'){let s=document.querySelector('[name=assignee]');s.value=ins.recommended.id;s.dispatchEvent(new Event('change',{bubbles:true}));return}if(k==='invite'){let r=await api('/hubs/'+hub+'/invite','POST');document.getElementById('invite').innerHTML=`<label>Invitation link<input readonly value="${esc(r.link)}" onclick="this.select()"></label><label>Invitation code<input readonly value="${esc(r.code)}" onclick="this.select()"></label><small>Valid for seven days. Local links require the same network.</small>`;return}await render();if(['open','back','tab','logout'].includes(k))window.scrollTo({top:0,behavior:'auto'})}));const decorate=()=>{el.querySelectorAll('select').forEach(s=>{if(s.dataset.bubbled)return;s.dataset.bubbled='1';const group=document.createElement('div');group.className='choiceBubbles';group.setAttribute('role','group');group.setAttribute('aria-label',s.closest('label')?.childNodes[0]?.textContent||s.name);const sync=()=>{Array.from(group.children).forEach(b=>{const on=b.dataset.value===s.value;b.setAttribute('aria-pressed',String(on));b.classList.toggle('chosen',on)})};Array.from(s.options).forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.dataset.value=o.value;b.className='choiceBubble';const art=document.createElement('span');art.textContent=s.name==='property_type'?(o.value==='House'?'🏡':'🏢'):s.name==='category'?(board?.categories.find(x=>x.id===o.value)?.icon||'✨'):o.textContent.trim().slice(0,1).toUpperCase();b.append(art,document.createTextNode(o.textContent));b.onclick=()=>{s.value=o.value;s.dispatchEvent(new Event('change',{bubbles:true}));sync()};group.append(b)});s.after(group);if(s.options.length){s.classList.add('bubbleNative');s.tabIndex=-1;s.setAttribute('aria-hidden','true')}s.addEventListener('change',sync);sync()})};new MutationObserver(decorate).observe(el,{childList:true,subtree:true});run(render)();</script></html>
